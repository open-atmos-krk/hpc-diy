name: Grafana Interactive Snapshot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: grafana-gh-pages-previews
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    env:
      GRAFANA_URL: http://localhost:3000
      PROMETHEUS_URL: http://localhost:9090
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DASHBOARD_UID: cluster-health-overview
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Generate interactive snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/grafana-snapshot"
          python3 monitoring/scripts/render_grafana_snapshot.py \
            --output "$RUNNER_TEMP/grafana-snapshot/index.html" \
            --grafana-url "$GRAFANA_URL" \
            --prometheus-url "$PROMETHEUS_URL" \
            --dashboard-uid "$DASHBOARD_UID" \
            --from-time now-3h \
            --to-time now \
            --step 60s

      - name: Publish preview to gh-pages
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/gh-pages"
          mkdir -p "$RUNNER_TEMP/gh-pages/pr/$PR_NUMBER"
          cp "$RUNNER_TEMP/grafana-snapshot/index.html" "$RUNNER_TEMP/gh-pages/pr/$PR_NUMBER/index.html"
          touch "$RUNNER_TEMP/gh-pages/.nojekyll"
          git -C "$RUNNER_TEMP/gh-pages" config user.name github-actions[bot]
          git -C "$RUNNER_TEMP/gh-pages" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$RUNNER_TEMP/gh-pages" add "pr/$PR_NUMBER/index.html" .nojekyll
          git -C "$RUNNER_TEMP/gh-pages" commit -m "Update Grafana preview for PR #$PR_NUMBER" || true
          git -C "$RUNNER_TEMP/gh-pages" push origin gh-pages

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- grafana-interactive-preview -->';
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr/${context.issue.number}/`;
            const body = `${marker}\nInteractive Grafana snapshot: ${url}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - name: Remove preview from gh-pages
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/gh-pages"
          rm -rf "$RUNNER_TEMP/gh-pages/pr/$PR_NUMBER"
          git -C "$RUNNER_TEMP/gh-pages" config user.name github-actions[bot]
          git -C "$RUNNER_TEMP/gh-pages" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$RUNNER_TEMP/gh-pages" add -A "pr/$PR_NUMBER"
          git -C "$RUNNER_TEMP/gh-pages" commit -m "Remove Grafana preview for PR #$PR_NUMBER" || true
          git -C "$RUNNER_TEMP/gh-pages" push origin gh-pages
